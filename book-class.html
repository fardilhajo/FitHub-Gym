<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitHub Gym - Horários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pages/booking.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">FitHub Gym</a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="book-class.html" aria-current="page">Classes</a></li>
      <li><a href="trainer-profile.html">Trainers</a></li>
      <li><a href="index.html#equipment">Equipment</a></li>
    </ul>

    <div class="nav-actions">
      <span class="btn-login">Login</span>
      <span class="btn-join">Join Now</span>
    </div>
  </nav>

  <main class="content">
    <header class="page-header">
      <p class="page-kicker">Classes</p>
      <h1>Class Schedule</h1>
      <p>Find the right session for your week with a cleaner, consistent booking experience.</p>
    </header>

    <section class="filter-section">
      <div class="filter-title">
        <h2>Filters</h2>
      </div>

      <form class="filter-controls">
        <input type="text" class="input-search" placeholder="Search classes...">

        <select class="select-field">
          <option>All Types</option>
          <option>HIIT</option>
          <option>Yoga</option>
          <option>Spinning</option>
          <option>Strength</option>
          <option>Pilates</option>
        </select>

        <select class="select-field">
          <option>All Days</option>
          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
          <option>Sunday</option>
        </select>

        <select class="select-field">
          <option>All Trainers</option>
          <option>Ricardo Silva</option>
          <option>Ana Costa</option>
          <option>Miguel Sousa</option>
          <option>Sofia Martins</option>
        </select>

        <button type="reset" class="btn-clear">Clear</button>
      </form>
    </section>
  </main>
</body>
</html>
