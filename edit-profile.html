<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - FitHub Gym</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/pages/edit-profile.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">FitHub Gym</a>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="book-class.html">Classes</a></li>
      <li><a href="trainer-profile.html">Trainers</a></li>
      <li><a href="#equipment">Equipment</a></li>
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="btn-login">Login</a>
      <a href="register.html" class="btn-join">Join Now</a>
    </div>
  </nav>

  <main class="edit-profile-content">

    <header class="page-header">
      <h1>Edit Profile</h1>
      <p>Update your personal information and account settings</p>
    </header>

    <form action="edit-profile.php" method="post" enctype="multipart/form-data" class="edit-profile-form">

      <!-- Profile photo -->
      <div class="avatar-section">
        <div class="avatar-wrapper">
          <img
            id="avatar-preview"
            src="https://ui-avatars.com/api/?name=Jo%C3%A3o+Silva&background=f18c4f&color=fff&size=128"
            alt="Profile photo"
            class="avatar-img"
          >
          <label for="photo" class="avatar-upload-btn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                 viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8
                       a2 2 0 0 1 2-2h4l2-3h6l2 3h4
                       a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </label>
          <input
            id="photo"
            type="file"
            name="photo"
            accept="image/*"
            class="avatar-file-input"
          >
        </div>
        <p class="avatar-hint">Click the camera icon to upload a new photo</p>
      </div>

      <!-- Identity -->
      <fieldset class="form-group">
        <legend>Personal Information</legend>

        <label for="full-name">Full Name</label>
        <input
          id="full-name"
          type="text"
          name="full_name"
          placeholder="Your full name"
          value="João Silva"
          required
        >

        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Username"
          value="joaosilva"
          required
        >

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="your.email@example.com"
          value="joao.silva@email.com"
          required
        >
      </fieldset>

      <!-- Security -->
      <fieldset class="form-group">
        <legend>Change Password <span class="legend-hint">(leave blank to keep current)</span></legend>

        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Minimum 6 characters"
          minlength="6"
        >

        <label for="confirm-password">Confirm New Password</label>
        <input
          id="confirm-password"
          type="password"
          name="confirm_password"
          placeholder="Re-enter new password"
          minlength="6"
        >
      </fieldset>

      <button type="submit" class="btn-save">Save Changes</button>

    </form>

    <p class="back-link"><a href="index.html">&larr; Back to Dashboard</a></p>

  </main>

  <script>
    document.getElementById('photo').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('avatar-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
