<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FitHub Gym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">FitHub Gym</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="book-class.html">Classes</a></li>
      <li><a href="trainer-profile.html">Trainers</a></li>
      <li><a href="index.html#equipment">Equipment</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn-login">Login</a>
      <a href="register.html" class="btn-join">Join Now</a>
    </div>
  </nav>

  <main class="Content">

        <header class="page-header">
            <h1>Join FitHub Gym</h1>
            <p>Create your account to get started</p>
        </header>

        <form action="register.php" method="post">

            <label for="full-name">Full name</label>
            <input
              id="full-name"
              type="text"
              name="full_name"
              class="input-name"
              placeholder="Your Name"
              required
            >

            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              class="input-email"
              placeholder="your.email@example.com"
              required
            >

            <label for="username">Username</label>
            <input
              id="username"
              type="text"
              name="username"
              class="input-username"
              placeholder="Username"
              required
            >

            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              class="input-password"
              placeholder="Minimum 6 characters"
              minlength="6"
              required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
              id="confirm-password"
              type="password"
              name="confirm_password"
              class="input-confirm-password"
              placeholder="Re-enter your password"
              minlength="6"
              required
            >

            <button type="submit" class="btn-clear">Create Account</button>

        </form>

        <p>Already have an account? <a href="login.html">Log in Here</a></p>

    </main>
    
</body>
</html>
